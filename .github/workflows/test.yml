name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and hook tests
        # No argument: Node discovers *.test.js itself. Passing a directory
        # (node --test test/) resolves as a module path on some Node versions
        # and fails with MODULE_NOT_FOUND.
        run: node --test
